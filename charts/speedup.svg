rt">tape-sha256</text><text x="60.0" y="410.0" fill="#6b7789" font-family='ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace' font-size="11" font-weight="400" text-anchor="start">Each machine is one same-session run, so bars compare within a group; clocks differ across machines.</text><text x="60.0" y="426.0" fill="#6b7789" font-family='ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace' font-size="11" font-weight="400" text-anchor="start">Zen 3 firedancer has no SHA-NI batch kernel and falls back to 8-lane AVX. Intel EMR measures like GNR.</text></svg>