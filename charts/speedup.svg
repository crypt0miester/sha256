tart">firedancer</text><rect x="411" y="377" width="14" height="11" rx="2.5" fill="#3987e5"/><text x="433.0" y="386.0" fill="#aab4c4" font-family='ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" text-anchor="start">tape-sha256</text><text x="60.0" y="410.0" fill="#6b7789" font-family='ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace' font-size="11" font-weight="400" text-anchor="start">Each machine is one same-session run, so bars compare within a group; clocks differ across machines.</text><text x="60.0" y="426.0" fill="#6b7789" font-family='ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace' font-size="11" font-weight="400" text-anchor="start">Zen 3 firedancer has no SHA-NI batch kernel and falls back to 8-lane AVX. Intel EMR measures like GNR.</text></svg>